<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Datos para la visa</title>
<style>
  :root{
    color-scheme: light;
    --bg:#EEF2F4; --card:#FFFFFF;
    --ink:#12212A; --ink-2:#4E5D66;
    --line:#D3DBDF;
    --azul:#0F5673; --azul-claro:#E3EFF5;
    --verde:#137A4B; --verde-claro:#E1F1E9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:18px; line-height:1.5; -webkit-text-size-adjust:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:620px;margin:0 auto;padding:20px 18px 48px}

  .barra{margin-bottom:22px}
  .track{height:10px;background:#DCE4E8;border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--azul);border-radius:99px;transition:width .25s ease}
  .cuenta{margin-top:8px;font-size:15px;color:var(--ink-2)}

  .tarjeta{background:var(--card);border-radius:14px;padding:24px 20px;box-shadow:0 1px 3px rgba(18,33,42,.08)}

  h1{font-size:30px;line-height:1.2;margin:0 0 14px;text-wrap:balance}
  h2{font-size:25px;line-height:1.25;margin:0 0 10px;text-wrap:balance}
  p{margin:0 0 14px}
  .ayuda{color:var(--ink-2);font-size:16px;margin:-2px 0 18px}
  .intro li{margin-bottom:10px}

  .dato{
    background:var(--azul-claro);
    border-left:5px solid var(--azul);
    border-radius:0 10px 10px 0;
    padding:16px 18px;
    font-size:20px;
    line-height:1.45;
    margin-bottom:18px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }

  input[type=text], textarea{
    width:100%;font-family:inherit;font-size:19px;line-height:1.45;
    padding:14px;border:2px solid var(--line);border-radius:10px;
    background:#FBFDFD;color:var(--ink);
  }
  textarea{min-height:120px;resize:vertical}
  input[type=text]:focus, textarea:focus{border-color:var(--azul);outline:none}

  .opciones{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
  .op{
    display:block;width:100%;text-align:left;font-family:inherit;font-size:19px;
    padding:16px 18px;border:2px solid var(--line);border-radius:10px;
    background:#FBFDFD;color:var(--ink);cursor:pointer;
  }
  .op:hover{border-color:var(--azul)}
  .op.sel{border-color:var(--azul);background:var(--azul-claro)}
  .op.si{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600;text-align:center}
  .op.si:hover{background:#0F6A41;border-color:#0F6A41}

  .pie{display:flex;align-items:center;gap:12px;margin-top:22px}
  .btn{font-family:inherit;font-size:19px;font-weight:600;padding:15px 24px;
       border-radius:10px;border:2px solid transparent;cursor:pointer;min-height:54px}
  .btn.principal{background:var(--azul);color:#fff;flex:1}
  .btn.principal:hover{background:#0C455D}
  .btn.atras{background:none;border-color:var(--line);color:var(--ink-2);padding:15px 18px}
  .btn.atras:hover{border-color:var(--ink-2)}
  .btn.verde{background:var(--verde);color:#fff;width:100%;font-size:20px;padding:18px 24px}
  .btn.verde:hover{background:#0F6A41}
  .btn.gris{background:none;border-color:var(--line);color:var(--ink-2);width:100%;margin-top:10px;font-weight:400}
  .saltar{display:block;width:100%;margin-top:14px;text-align:center;background:none;border:none;
          font-family:inherit;font-size:16px;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:8px}
  :focus-visible{outline:3px solid var(--azul);outline-offset:2px}

  .rep{border-top:1px solid var(--line);padding:14px 0}
  .rep:first-of-type{border-top:none}
  .rep .p{font-size:15px;color:var(--ink-2);margin:0 0 3px}
  .rep .r{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .rep .vacio{color:#8C9AA2;font-style:italic}
  .rep .marca{font-size:14px;color:var(--verde);font-weight:600}
  .rep button{background:none;border:none;font-family:inherit;font-size:15px;color:var(--azul);
              text-decoration:underline;cursor:pointer;padding:4px 0}
  .aviso{background:var(--verde-claro);border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:17px}
  .aviso b{display:block;margin-bottom:4px}
  .copia{width:100%;min-height:200px;font-size:15px;margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .oculto{display:none !important}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="barra oculto" id="barra">
    <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
    <div class="cuenta" id="cuenta"></div>
  </div>
  <div class="tarjeta" id="tarjeta"></div>
</div>

<script>
(function(){
"use strict";

/* Tu WhatsApp: pais + numero, sin + ni espacios. "" = ella elige el chat. */
var TELEFONO = "34632438175";

var PREG = [
  { id:"nombre",   q:"Tu nombre como aparece en el pasaporte" },
  { id:"soltera",  q:"Tu apellido de soltera", ayuda:"Como aparece en tu acta de nacimiento." },
  { id:"fnac",     q:"Tu fecha de nacimiento" },
  { id:"lugar",    q:"Dónde naciste" },
  { id:"cedula",   q:"Tu cédula" },
  { id:"civil",    q:"¿Cuál es tu estado civil?", tipo:"opcion", opts:["Casada","Viuda","Divorciada","Soltera"] },
  { id:"esposo",   q:"Datos de tu esposo", tipo:"largo",
    ayuda:"Nombre completo, fecha de nacimiento, dónde nació y su nacionalidad.",
    siSolo:{ id:"civil", vale:["Casada"] } },

  { id:"direccion", q:"¿Cuál es la dirección de tu casa?", tipo:"largo",
    ayuda:"Calle y número, sector, ciudad y provincia. Completa, como en una carta." },
  { id:"celular",   q:"¿Cuál es tu número de celular?", ayuda:"El tuyo personal, no el del colegio." },
  { id:"teltrabajo",q:"El teléfono del colegio donde trabajas" },
  { id:"correo",    q:"Tu correo personal" },
  { id:"correo2",   q:"Tu correo del Ministerio" },
  { id:"facebook",  q:"Tu Facebook" },
  { id:"instagram", q:"Tu Instagram" },
  { id:"tiktok",    q:"¿Tienes TikTok?", tipo:"opcion", opts:["No tengo","Sí"] },
  { id:"tiktokuser",q:"¿Cuál es tu usuario de TikTok?", siSolo:{ id:"tiktok", vale:["Sí"] } },

  { id:"pasaporte", q:"Tu pasaporte nuevo", ayuda:"Si algo no cuadra con el que tienes en la mano, corrígelo." },
  { id:"visa",      q:"Tu visa actual" },

  { id:"papa",      q:"¿Cómo se llama tu papá?", ayuda:"Nombre y apellidos completos, como en el acta." },
  { id:"papafnac",  q:"La fecha de nacimiento de tu papá" },
  { id:"mama",      q:"¿Cómo se llama tu mamá?", ayuda:"Nombre y apellidos completos." },
  { id:"mamafnac",  q:"La fecha de nacimiento de tu mamá" },
  { id:"padresus",  q:"¿Alguno de tus padres vive en Estados Unidos?", tipo:"opcion", opts:["No","Sí"] },
  { id:"familiaus", q:"¿Tienes hijos, hermanos o esposo viviendo en Estados Unidos?", tipo:"opcion", opts:["No","Sí"] },
  { id:"familiausq",q:"¿Quiénes y qué son tuyos?", tipo:"largo", ayuda:"Nombre y parentesco de cada uno.",
    siSolo:{ id:"familiaus", vale:["Sí"] } },
  { id:"primo",     q:"Tu familiar en Estados Unidos", ayuda:"Es a quien pondríamos como contacto allá." },
  { id:"alojamiento", q:"¿Te quedarías en su casa?", tipo:"opcion", opts:["Sí, en su casa","No, en otro sitio"] },

  { id:"centro",    q:"Dónde trabajas ahora" },
  { id:"cargo",     q:"Tu cargo" },
  { id:"desde",     q:"¿Desde cuándo trabajas ahí?", ayuda:"Mes y año. Si no recuerdas el mes, con el año basta." },
  { id:"sueldo",    q:"¿Cuánto ganas al mes?", ayuda:"En pesos. Aproximado está bien." },
  { id:"funciones", q:"¿Qué haces en tu puesto?", tipo:"largo",
    ayuda:"Dos o tres líneas: qué supervisas, qué coordinas, de qué te encargas." },
  { id:"minerva",   q:"El colegio donde trabajabas antes", ayuda:"Si las fechas no están bien, corrígelas." },
  { id:"anteriores",q:"¿En qué otros colegios trabajaste?", tipo:"largo",
    ayuda:"De cada uno: el nombre, qué hacías y de qué año a qué año." },
  { id:"estudios",  q:"¿Dónde estudiaste?", tipo:"largo",
    ayuda:"Desde la secundaria en adelante. De cada centro: el nombre, la ciudad, qué estudiaste y de qué año a qué año." },
  { id:"cv",        q:"¿Tienes un currículum actualizado?", tipo:"opcion",
    ayuda:"Si lo tienes, te ahorra las dos preguntas de arriba.", opts:["Sí, lo tengo","No tengo"] },

  { id:"viajes",    q:"Tus viajes a Estados Unidos", tipo:"largo",
    ayuda:"Si falta alguno, o te quedaste más o menos tiempo del que dice, corrígelo." },
  { id:"paises",    q:"¿Has viajado a algún otro país desde el año 2021?", tipo:"largo",
    ayuda:"Escribe cuáles. Si no has salido del país, pon «Ninguno»." },
  { id:"orgs",      q:"¿Perteneces a alguna iglesia, asociación de maestros o grupo parecido?", tipo:"largo",
    ayuda:"El nombre de cada una. Si no, pon «Ninguna»." },
  { id:"negada",    q:"¿Alguna vez te han negado una visa o la entrada a Estados Unidos?", tipo:"opcion",
    ayuda:"Esta hay que responderla exacta, aunque haya sido hace muchos años.", opts:["No, nunca","Sí"] },
  { id:"peticion",  q:"¿Alguien ha metido una petición de residencia o inmigrante por ti?", tipo:"opcion",
    opts:["No","Sí","No estoy segura"] },
  { id:"cuando",    q:"¿Cuándo piensas viajar y por cuánto tiempo?",
    ayuda:"Un mes aproximado basta. Si aún no lo sabes, pon «No lo sé todavía»." },
  { id:"paga",      q:"¿Quién pagaría el viaje?", tipo:"opcion", opts:["Yo misma","Oscar","Otra persona"] }
];

var LLAVE_R = "visa-respuestas-v2";
var LLAVE_P = "visa-previos-v2";
var pre = {}, resp = {};

function leerHash(){
  var h = (window.location.hash || "").replace(/^#/, "");
  if (h.indexOf("d=") === 0) h = h.slice(2);
  if (!h) return null;
  try {
    var b64 = h.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var n = 0; n < bin.length; n++) bytes[n] = bin.charCodeAt(n);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  } catch(e){ return null; }
}

try { resp = JSON.parse(localStorage.getItem(LLAVE_R) || "{}") || {}; } catch(e){ resp = {}; }
try { pre  = JSON.parse(localStorage.getItem(LLAVE_P) || "{}") || {}; } catch(e){ pre = {}; }

var delEnlace = leerHash();
if (delEnlace){
  pre = delEnlace;
  try { localStorage.setItem(LLAVE_P, JSON.stringify(pre)); } catch(e){}
}

function guardar(){ try { localStorage.setItem(LLAVE_R, JSON.stringify(resp)); } catch(e){} }

function activa(p){
  if (!p.siSolo) return true;
  return p.siSolo.vale.indexOf(resp[p.siSolo.id]) !== -1;
}
function lista(){ return PREG.filter(activa); }

var vista = "inicio", i = 0, volver = false;
var tarjeta = document.getElementById("tarjeta");
var barra   = document.getElementById("barra");

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

function pintar(){
  if (vista === "inicio") return pintarInicio();
  if (vista === "repaso") return pintarRepaso();
  return pintarPregunta();
}

function pintarInicio(){
  barra.classList.add("oculto");
  var hechas = lista().filter(function(p){ return resp[p.id]; }).length;
  var conDatos = Object.keys(pre).length > 0;
  tarjeta.innerHTML =
    '<h1>Datos para la visa</h1>' +
    '<p>Son preguntas cortas, de una en una. No hay que apurarse.</p>' +
    '<ul class="intro">' +
      (conDatos ? '<li>En varias ya verás el dato escrito. Solo tienes que mirarlo y decir si está bien, o corregirlo.</li>' : '') +
      '<li>Si no sabes alguna, toca <b>No lo sé</b> y sigue.</li>' +
      '<li>Se va guardando sola. Puedes cerrar y volver después.</li>' +
      '<li>Al final sale un botón para mandárselo todo a Oscar por WhatsApp.</li>' +
    '</ul>' +
    '<div class="pie"><button class="btn principal" id="empezar">' +
      (hechas ? 'Seguir donde lo dejaste' : 'Empezar') + '</button></div>' +
    (hechas ? '<button class="saltar" id="verepaso">Ver lo que ya contesté</button>' : '');

  document.getElementById("empezar").onclick = function(){
    var L = lista(), pend = -1;
    for (var n = 0; n < L.length; n++){ if (!resp[L[n].id]){ pend = n; break; } }
    if (pend === -1){ vista = "repaso"; return pintar(); }
    i = pend; vista = "pregunta"; pintar();
  };
  var vr = document.getElementById("verepaso");
  if (vr) vr.onclick = function(){ vista = "repaso"; pintar(); };
}

function pintarPregunta(){
  var L = lista();
  if (i >= L.length){ vista = "repaso"; return pintar(); }
  var p = L[i];

  barra.classList.remove("oculto");
  document.getElementById("fill").style.width = (i / L.length * 100) + "%";
  document.getElementById("cuenta").textContent = "Pregunta " + (i + 1) + " de " + L.length;

  var valor = resp[p.id] || "";
  var enConfirmar = !!pre[p.id] && !valor && !p.editando;

  var html = '<h2>' + esc(p.q) + '</h2>';
  if (p.ayuda) html += '<p class="ayuda">' + esc(p.ayuda) + '</p>';

  if (enConfirmar){
    html += '<div class="dato">' + esc(pre[p.id]) + '</div>' +
            '<div class="opciones">' +
              '<button class="op si" id="ok">Sí, está bien</button>' +
              '<button class="op" id="corregir">No, hay que corregirlo</button>' +
            '</div>' +
            (i > 0 ? '<div class="pie"><button class="btn atras" id="atras">Atrás</button></div>' : '');
  } else if (p.tipo === "opcion"){
    html += '<div class="opciones">';
    for (var n = 0; n < p.opts.length; n++){
      html += '<button class="op' + (valor === p.opts[n] ? ' sel' : '') + '" data-op="' + esc(p.opts[n]) + '">' + esc(p.opts[n]) + '</button>';
    }
    html += '</div><div class="pie">' + (i > 0 ? '<button class="btn atras" id="atras">Atrás</button>' : '') + '</div>';
  } else {
    var inicial = valor || (p.editando ? (pre[p.id] || "") : "");
    if (p.tipo === "largo") html += '<textarea id="campo" placeholder="Escribe aquí">' + esc(inicial) + '</textarea>';
    else html += '<input type="text" id="campo" value="' + esc(inicial) + '" placeholder="Escribe aquí">';
    html += '<div class="pie">' +
              (i > 0 ? '<button class="btn atras" id="atras">Atrás</button>' : '') +
              '<button class="btn principal" id="siguiente">Siguiente</button>' +
            '</div>';
  }
  html += '<button class="saltar" id="saltar">No lo sé, seguir</button>';
  tarjeta.innerHTML = html;

  var ok = document.getElementById("ok");
  if (ok) ok.onclick = function(){ resp[p.id] = pre[p.id]; guardar(); avanzar(); };
  var corr = document.getElementById("corregir");
  if (corr) corr.onclick = function(){ p.editando = true; pintar(); };

  var campo = document.getElementById("campo");
  if (campo){
    campo.oninput = function(){ resp[p.id] = campo.value; guardar(); };
    campo.onkeydown = function(ev){
      if (ev.key === "Enter" && p.tipo !== "largo"){ ev.preventDefault(); guardarCampo(p); }
    };
  }

  var ops = tarjeta.querySelectorAll(".op[data-op]");
  for (var m = 0; m < ops.length; m++){
    ops[m].onclick = function(){
      resp[p.id] = this.getAttribute("data-op");
      guardar();
      var todas = tarjeta.querySelectorAll(".op[data-op]");
      for (var z = 0; z < todas.length; z++) todas[z].classList.remove("sel");
      this.classList.add("sel");
      setTimeout(avanzar, 220);
    };
  }

  var sig = document.getElementById("siguiente");
  if (sig) sig.onclick = function(){ guardarCampo(p); };
  var atr = document.getElementById("atras");
  if (atr) atr.onclick = function(){ p.editando = false; if (i > 0){ i--; window.scrollTo(0,0); pintar(); } };
  document.getElementById("saltar").onclick = function(){
    if (!resp[p.id]) { resp[p.id] = "— no lo sé —"; guardar(); }
    p.editando = false; avanzar();
  };
}

function guardarCampo(p){
  var campo = document.getElementById("campo");
  var v = campo ? campo.value.trim() : "";
  if (!v) return;
  resp[p.id] = v; guardar();
  p.editando = false;
  avanzar();
}

function avanzar(){
  window.scrollTo(0,0);
  if (volver){ volver = false; vista = "repaso"; return pintar(); }
  i++;
  if (i >= lista().length) vista = "repaso";
  pintar();
}

function confirmado(p){ return !!pre[p.id] && resp[p.id] === pre[p.id]; }

function textoFinal(){
  var L = lista();
  var nuevos = [], iguales = [];
  for (var n = 0; n < L.length; n++){
    var p = L[n], r = resp[p.id];
    if (!r) continue;
    if (confirmado(p)) iguales.push(p.q);
    else { nuevos.push(p.q); nuevos.push(r); nuevos.push(""); }
  }
  var t = ["Datos para la visa:", ""];
  if (nuevos.length){ t.push("LO QUE CONTESTÉ Y LO QUE CORREGÍ:", ""); t = t.concat(nuevos); }
  if (iguales.length){
    t.push("ESTO LO REVISÉ Y ESTÁ BIEN:");
    for (var k = 0; k < iguales.length; k++) t.push("- " + iguales[k]);
    t.push("");
  }
  if (resp.cv === "Sí, lo tengo") t.push("(Te mando también el currículum por aquí.)");
  return t.join("\n");
}

function pintarRepaso(){
  barra.classList.remove("oculto");
  document.getElementById("fill").style.width = "100%";
  document.getElementById("cuenta").textContent = "Ya están todas";

  var L = lista();
  var html = '<h2>Repasa antes de mandarlo</h2>' +
             '<p class="ayuda">Toca «Cambiar» en cualquiera si quieres corregirla.</p>';
  for (var n = 0; n < L.length; n++){
    var p = L[n], r = resp[p.id];
    html += '<div class="rep">' +
              '<p class="p">' + esc(p.q) + (confirmado(p) ? ' <span class="marca">revisado</span>' : '') + '</p>' +
              '<p class="r' + (r ? '' : ' vacio') + '">' + esc(r || "sin contestar") + '</p>' +
              '<button data-ir="' + n + '">Cambiar</button>' +
            '</div>';
  }
  if (resp.cv === "Sí, lo tengo"){
    html += '<div class="aviso" style="margin-top:20px"><b>No olvides el currículum</b>' +
            'Mándaselo a Oscar por aquí mismo, en PDF o en fotos de cada página.</div>';
  }
  html += '<div style="margin-top:22px">' +
            '<button class="btn verde" id="enviar">Mandárselo a Oscar por WhatsApp</button>' +
            '<button class="btn gris" id="copiar">Copiar el texto</button>' +
          '</div>' +
          '<textarea class="copia oculto" id="areacopia" readonly></textarea>';
  tarjeta.innerHTML = html;

  var bs = tarjeta.querySelectorAll("[data-ir]");
  for (var m = 0; m < bs.length; m++){
    bs[m].onclick = function(){
      i = parseInt(this.getAttribute("data-ir"), 10);
      var pp = lista()[i];
      if (pp && pre[pp.id]) pp.editando = true;
      volver = true; vista = "pregunta"; window.scrollTo(0,0); pintar();
    };
  }

  document.getElementById("enviar").onclick = function(){
    window.location.href = "https://wa.me/" + TELEFONO + "?text=" + encodeURIComponent(textoFinal());
  };
  document.getElementById("copiar").onclick = function(){
    var area = document.getElementById("areacopia");
    area.value = textoFinal();
    area.classList.remove("oculto");
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(area.value).then(function(){
        document.getElementById("copiar").textContent = "Copiado";
      }, function(){ area.focus(); area.select(); });
    } else { area.focus(); area.select(); }
  };
}

pintar();
})();
</script>
</body>
</html>
